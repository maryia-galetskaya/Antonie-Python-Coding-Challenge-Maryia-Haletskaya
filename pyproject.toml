[project]
name = "antonie-books"
version = "0.1.0"
description = "Antonie Books API"
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.11,<5",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
antonie-books-seed = "antonie_books.infrastructure.seed:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antonie_books"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: tests that do not require external services",
    "e2e: end-to-end tests that require the API and MongoDB services",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
