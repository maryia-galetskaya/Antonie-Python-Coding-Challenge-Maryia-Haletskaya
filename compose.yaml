name: antonie-books-dev

services:
  api:
    build:
      context: .
    environment:
      ANTONIE_BOOKS_MONGO_URI: mongodb://mongo:27017/?retryWrites=false
      ANTONIE_BOOKS_MONGO_DATABASE: antonie_books
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
