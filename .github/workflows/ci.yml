name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/antonie-books-api

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.17
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.17
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Build Python distributions
        run: uv build
      - name: Build Docker image
        run: docker build --tag antonie-books:e2e .
      - name: Save Docker image
        run: docker save antonie-books:e2e --output antonie-books-e2e-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: antonie-books-e2e-image
          path: antonie-books-e2e-image.tar
          if-no-files-found: error
          retention-days: 2

  unit:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.17
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - run: uv sync --locked --no-install-project --all-groups
      - name: Install built wheel
        run: uv pip install --python .venv/bin/python dist/*.whl
      - name: Run unit tests with coverage
        run: >-
          uv run --no-sync pytest -m unit
          --junitxml=junit-unit.xml
          --cov=antonie_books.application.services
          --cov-report=xml:coverage-unit.xml
          --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            junit-unit.xml
            coverage-unit.xml
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.17
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: antonie-books-e2e-image
          path: .
      - run: docker load --input antonie-books-e2e-image.tar
      - run: uv sync --locked --all-groups
      - name: Start isolated end-to-end stack
        env:
          ANTONIE_BOOKS_API_IMAGE: antonie-books:e2e
          ANTONIE_BOOKS_MONGO_DATABASE: antonie_e2e_books
        run: docker compose -f compose.e2e.yaml -p antonie-e2e up --no-build -d
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8001/books >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready within 60 seconds" >&2
          docker compose -f compose.e2e.yaml -p antonie-e2e ps
          docker compose -f compose.e2e.yaml -p antonie-e2e logs
          exit 1
      - name: Run end-to-end HTTP tests
        env:
          ANTONIE_BOOKS_E2E_URL: http://localhost:8001
          ANTONIE_BOOKS_MONGO_URI: mongodb://localhost:27018/?retryWrites=false
          ANTONIE_BOOKS_MONGO_DATABASE: antonie_e2e_books
        run: uv run pytest -m e2e --junitxml=junit-e2e.xml
      - name: Verify API returns safe 503 when MongoDB stops
        run: |
          docker compose -f compose.e2e.yaml -p antonie-e2e stop mongo
          uv run python - <<'PY'
          import time

          import httpx

          deadline = time.monotonic() + 40
          last_error = None
          while time.monotonic() < deadline:
              try:
                  response = httpx.get("http://localhost:8001/books", timeout=3.0)
                  if response.status_code == 503:
                      assert response.json() == {
                          "error": {
                              "code": "database_unavailable",
                              "message": "The database is temporarily unavailable.",
                          }
                      }, response.text
                      assert response.headers.get("retry-after") == "1"
                      break
                  last_error = f"GET /books returned {response.status_code}: {response.text}"
              except httpx.HTTPError as exc:
                  last_error = str(exc)
              time.sleep(0.5)
          else:
              raise AssertionError(
                  f"API did not return the safe MongoDB 503 response within 40 seconds: {last_error}"
              )
      - name: Capture Compose state on failure
        if: failure()
        run: |
          docker compose -f compose.e2e.yaml -p antonie-e2e ps > compose-ps.txt
          docker compose -f compose.e2e.yaml -p antonie-e2e logs > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-reports
          path: |
            junit-e2e.xml
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop end-to-end stack and remove volumes
        if: always()
        run: docker compose -f compose.e2e.yaml -p antonie-e2e down --volumes --remove-orphans
